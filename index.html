<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <h2>Faizan</h2>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Skills</a>
        <a href="#">Contact us</a>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <h1>Welcome to Our Website</h1>
      <p>We provide best services for you</p>
      <button>Get Started</button>
    </section>

    <!-- Testimonials -->
    <section class="testimonials">
      <h2>What Our Clients Say</h2>

      <div class="card">
        <p>"Amazing service!"</p>
        <h4>- Ali</h4>
      </div>

      <div class="card">
        <p>"Very professional"</p>
        <h4>- Ahmed</h4>
      </div>
    </section>

    <!-- Contact -->
    <section class="contact">
      <h2>Get in Touch</h2>
      <form>
        <input type="text" placeholder="Name" />
        <input type="email" placeholder="Email" />
        <textarea placeholder="Message"></textarea>
        <button>Send</button>
      </form>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 MyBrand. All rights reserved.</p>
    </footer>
  </body>
</html>
